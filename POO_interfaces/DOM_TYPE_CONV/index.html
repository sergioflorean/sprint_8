<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Vista previa de la tarjeta</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="page">
    <main class="content page__content">
      <div class="filter content__filter">
        El modo de visualización:
        <button
          type="button"
          class="button filter__button filter__button_type_grid"
          data-elements-type="grid"
        ></button>
        <button
          type="button"
          class="button filter__button filter__button_type_column"
          data-elements-type="column"
        ></button>
      </div>
      <section class="card-list">
        <header class="heading">
          <h2 class="heading__title">Resultado</h2>
        </header>
        <div class="card-list__items">
          <!-- Contenedor para agregar tarjetas -->
        </div>
      </section>
    </main>
    <div class="popup">
      <div class="popup__content">
        <button type="button" class="popup__close"></button>
        <img
          src="https://practicum-content.s3.us-west-1.amazonaws.com/web-code/oop/moved_card_detail.jpg"
          alt=""
          class="popup__image"
        />
        <p class="popup__caption"></p>
      </div>
    </div>

    <!--Plantilla de tarjeta por defecto-->
    <template id="default-card">
      <article class="card">
        <img src="" alt="" class="card__image" />
        <h3 class="card__title"></h3>
        <p class="card__property"></p>
        <button class="button classic-button card__button">
          Más información
        </button>
      </article>
    </template>

    <!-- Plantilla de tarjeta horizontal -->
    <template id="horizontal-card">
      <article class="card card_content_horizontal">
        <img src="" alt="" class="card__image" />
        <div class="card__description">
          <h3 class="card__title"></h3>
          <p class="card__info"></p>
          <p class="card__property"></p>
          <span class="card__span-accent">
            Precio:
            <span class="card__price-property"></span>
          </span>
          <button class="button classic-button card__button">
            Añadir al carrito
          </button>
        </div>
      </article>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
